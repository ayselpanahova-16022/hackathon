<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PASHA Insurance - Settings</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="Logo.png" alt="PASHA Insurance Logo">
    </div>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="policies.html">📄 Policies</a>
      <a href="claims.html">🧾 Claims</a>
      <a href="payments.html">💳 Payments</a>
      <a href="settings.html" class="active">⚙️ Settings</a>
    </nav>
  </div>
  
  <div class="main">
    <div class="topbar">
      <h2>Settings</h2>
    </div>
    
    <div class="settings-container">
      <div class="settings-section">
        <h3>Account Information</h3>
        <div class="settings-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" value="Jamaladdin Hasanov">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" value="jhasanov@ada.edu.az">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" value="+994(77)5728424">
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" value="1980-06-15">
          </div>
          <button class="btn-primary">Update Information</button>
        </div>
      </div>
      
      <div class="settings-section">
        <h3>Security</h3>
        <div class="settings-form">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" placeholder="••••••••">
          </div>
          <button class="btn-primary">Change Password</button>
        </div>
      </div>
      
      <div class="settings-section">
        <h3>Notifications</h3>
        <div class="settings-form">
          <div class="form-group checkbox">
            <input type="checkbox" id="email-notif" checked>
            <label for="email-notif">Email Notifications</label>
          </div>
          <div class="form-group checkbox">
            <input type="checkbox" id="sms-notif" checked>
            <label for="sms-notif">SMS Notifications</label>
          </div>
          <div class="form-group checkbox">
            <input type="checkbox" id="claim-notif" checked>
            <label for="claim-notif">Claim Updates</label>
          </div>
          <div class="form-group checkbox">
            <input type="checkbox" id="payment-notif" checked>
            <label for="payment-notif">Payment Reminders</label>
          </div>
          <div class="form-group checkbox">
            <input type="checkbox" id="promo-notif">
            <label for="promo-notif">Promotional Offers</label>
          </div>
          <button class="btn-primary">Save Preferences</button>
        </div>
      </div>
      
      <div class="settings-section">
        <h3>Payment Methods</h3>
        <div class="payment-cards">
          <div class="payment-card">
            <div class="card-info">
              <p>Visa •••• 4567</p>
              <p>Expires: 09/27</p>
            </div>
            <div class="card-actions">
              <button class="btn-small">Edit</button>
              <button class="btn-small btn-danger">Remove</button>
            </div>
          </div>
          <div class="payment-card">
            <div class="card-info">
              <p>Bank Account •••• 7890</p>
              <p>Wells Fargo</p>
            </div>
            <div class="card-actions">
              <button class="btn-small">Edit</button>
              <button class="btn-small btn-danger">Remove</button>
            </div>
          </div>
        </div>
        <button class="btn-primary">+ Add Payment Method</button>
      </div>
    </div>
  </div>
</body>
</html>
